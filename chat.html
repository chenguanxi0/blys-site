  <script>
    (function () {
      var toggle = document.getElementById('navToggle');
      var links = document.getElementById('navLinks');
      if (!toggle || !links) return;
      var dropdowns = document.querySelectorAll('.nav-dropdown');
      dropdowns.forEach(function (dropdown) {
        var trigger = dropdown.querySelector('.nav-dropdown-trigger');
        if (!trigger) return;
        trigger.addEventListener('click', function (event) {
          event.preventDefault(); event.stopPropagation();
          dropdowns.forEach(function (item) { if (item !== dropdown) item.classList.remove('open'); });
          dropdown.classList.toggle('open');
        });
      });
      document.addEventListener('click', function () {
        dropdowns.forEach(function (item) { item.classList.remove('open'); });
      });
      toggle.dataset.navReady = '1';
      toggle.setAttribute('aria-expanded', 'false');
      toggle.addEventListener('click', function (event) {
        event.preventDefault();
        var open = links.classList.toggle('open');
        toggle.setAttribute('aria-expanded', String(open));
      });
      links.addEventListener('click', function (event) {
        if (event.target.closest('a')) {
          links.classList.remove('open');
          toggle.setAttribute('aria-expanded', 'false');
        }
      });
      document.addEventListener('click', function (event) {
        if (!event.target.closest('.nav-inner')) {
          links.classList.remove('open');
          toggle.setAttribute('aria-expanded', 'false');
        }
      });
    }());
  </script>

    async function initChatPage() {
      console.log('[chat] initChatPage start');
      // 确保登录弹窗存在
      ensureAuthModal();
      // 渲染表情面板
      renderEmojiPanel();
      // 绑定图片查看器（聊天消息图片点击放大）
      bindChatImageViewer();
      bindChatQuoteActions();
      // 初始状态：显示"检查中"，避免先闪出登录按钮
      setChatLoginLoading(true);
      // 先确认身份，再只加载对应房间，避免公共群聊的异步响应覆盖 VIP 群聊
      updateChatInputState();
      try { await fetchUser(); } catch (e) { console.error('[chat] fetchUser failed', e); }
      console.log('[chat] fetchUser done');
      updateChatInputState();
      const preferredRoom = __user.loggedIn && __user.isVip ? 'vip' : 'public';
      await switchChatRoom(preferredRoom, { skipUserRefresh: true });
      // 启动轮询
      startChatPoll();
      // 发送兜底：防止乐观气泡停在“发送中”但投递未启动
      startChatSendWatchdog();
      // 启动在线人数
      startOnlineTracking();
      // 注册通知（新消息手机弹窗提醒）
      initChatNotification();
      // 监听登录状态变化
      window.addEventListener('blys:user:change', () => {
        setChatLoginLoading(false);
        updateChatInputState();
        // 登录、会员激活或退出后，自动切换到身份对应的聊天室
        const preferredRoom = __user.loggedIn && __user.isVip ? 'vip' : 'public';
        if (currentRoom !== preferredRoom) {
          switchChatRoom(preferredRoom, { skipUserRefresh: true });
        }
        refreshChatPushSubscription();
      });
      // 兜底：再延迟刷新一次，避免某些浏览器事件时机问题
      setTimeout(() => {
        setChatLoginLoading(false);
        updateChatInputState();
        const preferredRoom = __user.loggedIn && __user.isVip ? 'vip' : 'public';
        if (currentRoom !== preferredRoom) switchChatRoom(preferredRoom, { skipUserRefresh: true });
      }, 300);
      // Enter 发送（Shift+Enter换行）
      const input = document.getElementById('chatInput');
      if (input) {
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChatMessage(); }
        });
        input.addEventListener('input', () => {
          input.style.height = 'auto';
          input.style.height = Math.min(input.scrollHeight, 160) + 'px';
        });
      }
      // 绑定头部淡出滚动效果
      bindChatHeadFade();
      // 聊天记录上滑到顶 → 加载更早历史（分页），不阻塞首屏
      const histBox = document.getElementById('chatMessages');
      if (histBox && !histBox.__histBound) {
        histBox.addEventListener('scroll', () => {
          if (Date.now() < chatSuppressHistoryUntil) return;
          if (histBox.querySelector('.chat-loading')) return;
          if (histBox.scrollTop <= 60 && chatHasMore[currentRoom] && !chatHistLoading) {
            chatHistLoading = true;
            loadChatMessages(currentRoom, { history: true }).finally(() => {
              setTimeout(() => { chatHistLoading = false; }, 400);
            });
          }
        });
        histBox.__histBound = true;
      }
    }

    function bindChatHeadFade() {
      const head = document.getElementById('chatScrollHead');
      if (!head) return;
      const onScroll = () => {
        const max = head.offsetHeight || 120;
        const y = window.scrollY || window.pageYOffset || 0;
        const ratio = Math.min(1, Math.max(0, y / Math.max(1, max * 0.7)));
        head.style.opacity = String(1 - ratio);
        head.style.transform = `translateY(-${ratio * 12}px)`;
      };
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();
    }

    function getChatSessionId() {
      let sid = localStorage.getItem('blys_chat_session');
      if (!sid) {
        sid = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        localStorage.setItem('blys_chat_session', sid);
      }
      return sid;
    }

    function startOnlineTracking() {
      refreshOnlineCount();
      sendHeartbeat();
      // 每12秒刷新人数，每25秒发送心跳
      if (chatOnlineTimer) clearInterval(chatOnlineTimer);
      if (chatHeartbeatTimer) clearInterval(chatHeartbeatTimer);
      chatOnlineTimer = setInterval(refreshOnlineCount, 12000);
      chatHeartbeatTimer = setInterval(sendHeartbeat, 25000);
    }

    async function sendHeartbeat() {
      try {
        await sbRpc('heartbeat', { p_session: getChatSessionId(), p_room: currentRoom });
      } catch (e) { /* 静默失败 */ }
    }

    async function refreshOnlineCount() {
      const el = document.getElementById('chatOnlineNum');
      if (!el) return;
      try {
        const d = await sbRpc('online_count', { p_room: currentRoom });
        const n = (d && typeof d === 'number') ? d : (d && d.count);
        el.textContent = Number.isFinite(n) ? n : '0';
      } catch (e) {
        el.textContent = '0';
      }
    }

    function renderEmojiPanel() {
      const panel = document.getElementById('chatEmojiPanel');
      if (!panel) return;
      panel.innerHTML = EMOJIS.slice(0, 80).map(e => `<span>${e}</span>`).join('');
    }

    function toggleEmojiPanel(e) {
      if (e) e.stopPropagation();
      const panel = document.getElementById('chatEmojiPanel');
      if (!panel) return;
      panel.classList.toggle('open');
      if (panel.classList.contains('open')) {
        const isEmojiBtn = (target) => target && target.closest && target.closest('.chat-tool-btn[title="表情"]');
        const closeOnClickOutside = (ev) => {
          if (!panel.contains(ev.target) && !isEmojiBtn(ev.target)) {
            panel.classList.remove('open');
            document.removeEventListener('click', closeOnClickOutside);
          }
        };
        setTimeout(() => document.addEventListener('click', closeOnClickOutside), 10);
      }
    }

    function insertEmoji(e) {
      if (!e.target.matches('span')) return;
      const input = document.getElementById('chatInput');
      if (!input) return;
      const emoji = e.target.textContent;
      const start = input.selectionStart;
      const end = input.selectionEnd;
      const text = input.value;
      input.value = text.slice(0, start) + emoji + text.slice(end);
      input.selectionStart = input.selectionEnd = start + emoji.length;
      input.focus();
      e.stopPropagation();
    }

    async function switchChatRoom(room, options) {
      options = options || {};
      currentRoom = room;
      // 更新标签样式（用 getAttribute 避免个别浏览器 dataset 兼容性问题导致中断）
      document.querySelectorAll('.chat-tab').forEach(t => t.classList.toggle('active', t.getAttribute('data-room') === room));

      const vipLock = document.getElementById('chatVipLock');
      const chatBox = document.getElementById('chatBox');
      const messagesBox = document.getElementById('chatMessages');
      const inputArea = document.getElementById('chatInputArea');

      // 点击 VIP 标签时主动刷新一次登录/会员状态，避免 SQL 更新后页面仍使用旧状态
      if (room === 'vip' && !options.skipUserRefresh && typeof fetchUser === 'function' && localStorage.getItem(USER_TOKEN_KEY) && !vipRefreshing) {
        vipRefreshing = true;
        try { await fetchUser(); } catch (e) { console.warn('[chat] refresh VIP user failed', e); }
        vipRefreshing = false;
      }

      // VIP 房间权限检查
      if (room === 'vip') {
        if (!__user.loggedIn || !__user.isVip) {
          if (chatBox) chatBox.style.display = 'none';
          if (vipLock) vipLock.style.display = 'flex';
          return;
        }
      }

      if (chatBox) chatBox.style.display = 'flex';
      if (vipLock) vipLock.style.display = 'none';
      if (messagesBox) messagesBox.style.display = 'block';
      if (inputArea) inputArea.style.display = 'block';
      if (messagesBox) messagesBox.innerHTML = '<div class="chat-loading">加载消息中…</div>';

      updateChatInputState();
      // 切到该频道即视为已读，清掉其未读角标
      if (unreadCounts[room]) { unreadCounts[room] = 0; updateUnreadBadges(); }
      const banner = document.getElementById('chatUnreadBanner');
      if (banner && unreadCounts.public + unreadCounts.vip === 0) banner.hidden = true;
      loadChatMessages(room);
      refreshOnlineCount();
      sendHeartbeat();
    }

    function setChatLoginLoading(isLoading) {
      const text = document.getElementById('chatLoginText');
      const btn = document.getElementById('chatLoginBtn');
      if (text) text.textContent = isLoading ? '正在检查登录状态…' : '登录后即可参与群聊';
      if (btn) btn.style.display = isLoading ? 'none' : '';
    }

    function updateChatInputState() {
      const mask = document.getElementById('chatLoginMask');
      const wrap = document.getElementById('chatInputWrap');
      if (!mask || !wrap) return;
      if (__user && __user.loggedIn) {
        mask.style.display = 'none';
        wrap.style.display = 'flex';
      } else {
        mask.style.display = 'flex';
        wrap.style.display = 'none';
      }
      setChatLoginLoading(false);
    }

    function fmtDateTime(dt){
      const d = new Date(dt);
      if (isNaN(d)) return '';
      const p = n => String(n).padStart(2,'0');
      return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }

    async function loadChatMessages(room, opts) {
      opts = opts || {};
      const loadSeq = ++chatLoadSeq;
      const box = document.getElementById('chatMessages');
      if (!box) return;
      const retry = opts.retry || 0;
      const isFirst = opts.isFirst || box.querySelector('.chat-loading') != null;
      if (isFirst) box.innerHTML = '<div class="chat-loading">加载消息中…</div>';
      // 首屏/失败自动重试：网络抖动或 Supabase 冷启动时，避免“进来没内容”
      const retryLater = () => {
        if (retry < 3) setTimeout(() => {
          if (room === currentRoom) loadChatMessages(room, { retry: retry + 1, history: opts.history });
        }, 1500);
      };

      try {
        console.log('[chat] loadChatMessages start', room, 'isFirst=', isFirst, 'history=', !!opts.history, 'retry=', retry);
        // 首屏只拉最近 30 条（更快）；轮询只拉增量；历史分页向上拉更早的 30 条
        const isHistory = !!opts.history;
        const rpcParams = { p_room: room };
        if (isHistory) {
          rpcParams.p_limit = 30;
          rpcParams.p_before = chatTsToIso(chatOldestTs[room]);
        } else if (isFirst) {
          rpcParams.p_limit = 30;
        } else {
          rpcParams.p_limit = 100;
          rpcParams.p_after = chatTsToIso(lastSeenTs[room]);
        }
        const d = await Promise.race([
          sbRpc('list_messages', rpcParams),
          new Promise((_, rej) => setTimeout(() => rej(new Error('list_messages timeout')), 5000))
        ]);
        console.log('[chat] list_messages response', room, d);
        if (loadSeq !== chatLoadSeq || room !== currentRoom) return;
        // list_messages 返回表，直接是数组；也兼容返回 {ok:true, list:[]} 的情况
        const list = Array.isArray(d) ? d : (d && d.list);
        if (!Array.isArray(list)) {
          console.warn('[chat] list_messages not array', d);
          if (retry < 3) { retryLater(); return; }
          if (isFirst) box.innerHTML = '<div class="chat-empty">暂无消息，来做第一个发言的人吧～</div>';
          return;
        }

        const myEmail = (__user && __user.email) || '';

        if (isHistory) {
          // 历史分页：把更早的消息插入列表顶部，并维持当前阅读位置
          prependChatHistory(list, room);
        } else if (isFirst) {
          // 首屏：最近 30 条为降序，翻转后整列表渲染，并滚到最新
          renderChatMessages(list.slice().reverse(), room, true);
          if (list.length) {
            const minTs = list.reduce((mn, m) => Math.min(mn, m.created_at ? new Date(m.created_at).getTime() : 0), Infinity);
            chatOldestTs[room] = minTs;
            chatHasMore[room] = list.length >= 30;
          }
        } else {
          // 增量：只把新消息追加到列表底部，不再重建整个列表
          for (const m of list) appendChatMessage(m, room);
        }

        // 未读统计：仅后台/非当前房间，且为增量拉取的新消息
        if (!isFirst && !isHistory) {
          const fresh = list.filter(m => m.user_email !== myEmail);
          if (fresh.length) {
            if (document.hidden && notifEnabled) {
              const latest = fresh[fresh.length - 1];
              const name = latest.user_nickname || (latest.user_email ? latest.user_email.split('@')[0] : '群友');
              const preview = (latest.content || '').trim() || (latest.image ? '[图片]' : '新消息');
              notifyNewMessage(room, name, preview, fresh.length);
            }
            if (inAppNotifOn && (document.hidden || currentRoom !== room)) {
              unreadCounts[room] = (unreadCounts[room] || 0) + fresh.length;
              updateUnreadBadges();
            }
          }
        }

        // 更新本房间最后已读消息时间戳（用于下一次增量拉取；历史分页不更新）
        if (!isHistory && list.length) {
          const maxTs = list.reduce((mx, m) => Math.max(mx, m.created_at ? new Date(m.created_at).getTime() : 0), 0);
          lastSeenTs[room] = Math.max(lastSeenTs[room] || 0, maxTs);
        }
      } catch (e) {
        console.error('[chat] loadChatMessages error', e);
        if (retry < 3) { retryLater(); return; }
        if (isFirst) box.innerHTML = '<div class="chat-empty">消息加载失败：' + esc(e && e.message ? e.message : String(e)) + '</div>';
      }
    }

    function renderChatMessageContent(m) {
      const text = (m.content || '').trim();
      const img = m.image;
      let html = '';
      if (m.reply_to_id) {
        const replyName = esc(m.reply_to_nickname || '群友');
        const replyText = (m.reply_to_content || '').trim();
        const replyPreview = replyText ? esc(replyText).replace(/\n/g, '<br>') : (m.reply_to_image ? '[图片]' : '[空消息]');
        html += `<div class="chat-quoted-message" data-quote-id="${esc(m.reply_to_id)}">
          <span class="chat-quoted-label">↩ 引用 ${replyName}</span>
          <span class="chat-quoted-text">${replyPreview}</span>
        </div>`;
      }
      if (img) {
        html += `<img class="chat-msg-img" src="${esc(img)}" alt="图片" loading="lazy" />`;
      }
      if (text) {
        html += `<div class="chat-msg-text">${esc(text).replace(/\n/g, '<br>')}</div>`;
      }
      return html || '<div class="chat-msg-text">[空消息]</div>';
    }

    // 图片查看器（点击聊天里的图片放大查看）
    function openChatImageViewer(src){
      const v = document.getElementById('chatImageViewer');
      const img = document.getElementById('chatImageViewerImg');
      if(!v || !img) { window.open(src, '_blank'); return; }
      img.src = src;
      img.alt = '图片';
      img.style.transform = 'scale(1)';
      v.hidden = false;
      v.classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeChatImageViewer(){
      const v = document.getElementById('chatImageViewer');
      if(!v || v.hidden) return;
      v.hidden = true;
      v.classList.remove('open');
      document.body.style.overflow = '';
      const i = document.getElementById('chatImageViewerImg');
      if(i) i.src = '';
    }

    // 图片查看器事件绑定（一次绑定，全局生效；通过事件委托处理动态消息）
    function bindChatImageViewer(){
      const v = document.getElementById('chatImageViewer');
      const closeBtn = document.getElementById('chatImageViewerClose');
      const img = document.getElementById('chatImageViewerImg');
      const msgBox = document.getElementById('chatMessages');
      if(!v || !closeBtn || !img) return;

      // 点击聊天里的图片 → 打开查看器
      if(msgBox && !msgBox.__chatImgBound){
        msgBox.addEventListener('click', (e) => {
          const t = e.target;
          if(t && t.classList && t.classList.contains('chat-msg-img')){
            e.preventDefault();
            openChatImageViewer(t.src);
          }
        });
        msgBox.__chatImgBound = true;
      }

      // 关闭按钮
      if(!closeBtn.__bound){
        closeBtn.addEventListener('click', closeChatImageViewer);
        closeBtn.__bound = true;
      }

      // 点击遮罩空白处关闭（点在图片上不关闭）
      if(!v.__bgBound){
        v.addEventListener('click', (e) => {
          if(e.target === v) closeChatImageViewer();
        });
        v.__bgBound = true;
      }

      // Esc 关闭
      if(!v.__escBound){
        document.addEventListener('keydown', (e) => {
          if(e.key === 'Escape' && !v.hidden) closeChatImageViewer();
        });
        v.__escBound = true;
      }

      // 双击图片切换放大/还原（原生支持的浏览器可双指捏合）
      if(!img.__dblkBound){
        let zoomed = false;
        img.addEventListener('dblclick', (e) => {
          e.stopPropagation();
          zoomed = !zoomed;
          img.style.transform = zoomed ? 'scale(2)' : 'scale(1)';
          img.style.cursor = zoomed ? 'zoom-out' : 'zoom-in';
        });
        img.__dblkBound = true;
      }
    }

    function renderChatMessageHtml(m, room) {
      const myEmail = (__user && __user.email) || '';
      const isMe = m.user_email === myEmail;
      const time = m.created_at ? fmtDateTime(m.created_at) : '';
      const name = esc(m.user_nickname || m.user_email?.split('@')[0] || '匿名');
      chatMessageCache.set(`${room}:${m.id}`, m);
      const pending = !!m.__pending;
      const failed = !!m.__failed;
      const canRecall = isMe && !pending && !failed && !m.recalled_at && m.id && m.created_at && (Date.now() - new Date(m.created_at).getTime() <= 2 * 60 * 1000);
      const recalled = !!m.recalled_at;
      const stateCls = pending ? ' chat-msg-pending' : (failed ? ' chat-msg-failed' : '');
      const pendingText = m.__sendState || '发送中…';
      const timeHtml = failed
        ? `<span class="chat-msg-state chat-msg-state-failed">发送失败 <button type="button" class="chat-retry-btn" onclick="retryChatSend('${esc(m.id)}')">重试</button></span>`
        : (pending ? `<span class="chat-msg-state">${esc(pendingText)}</span>` : `<span class="chat-msg-time">${time}</span>`);
      return `<div class="chat-msg ${isMe ? 'chat-msg-me' : 'chat-msg-other'}${stateCls}" data-message-id="${esc(m.id || '')}" data-room="${esc(room)}">
        ${canRecall ? `<button class="chat-recall-btn" type="button" onclick="recallChatMessage('${esc(m.id)}')">撤回</button>` : ''}
        <div class="chat-msg-avatar">${name.charAt(0).toUpperCase()}</div>
        <div class="chat-msg-body">
          <div class="chat-msg-meta">
            <span class="chat-msg-name">${name}</span>
            ${timeHtml}
          </div>
          ${recalled ? '<div class="chat-recalled">消息已撤回</div>' : renderChatMessageContent(m)}
        </div>
      </div>`;
    }

    function appendChatMessage(message, room) {
      const box = document.getElementById('chatMessages');
      if (!box || room !== currentRoom) return;
      // 增量轮询可能重复拉回已渲染的消息（如自己刚发的），按 id 去重；
      // 若已存在且远端标记为“已撤回”，则就地更新为撤回样式
      if (message && message.id) {
        const sel = '[data-message-id="' + String(message.id).replace(/"/g, '\\"') + '"]';
        const exist = box.querySelector(sel);
        if (exist) {
          if (message.recalled_at && !exist.querySelector('.chat-recalled')) {
            exist.outerHTML = renderChatMessageHtml(message, room);
          }
          return;
        }
      }
      // 轮询拉回的可能正是自己"发送中"的那条：就地替换占位消息，避免重复两条
      if (message && !message.__pending && message.user_email === ((__user && __user.email) || '')) {
        const key = chatSendKey(room, (message.content || '').trim(), message.image || '');
        const tempId = chatPendingKeys.get(key);
        if (tempId) {
          const holder = box.querySelector('[data-message-id="' + tempId + '"]');
          chatPendingKeys.delete(key);
          chatPendingSends.delete(tempId);
          if (holder) {
            holder.outerHTML = renderChatMessageHtml(message, room);
            return;
          }
        }
      }
      const empty = box.querySelector('.chat-empty, .chat-loading');
      if (empty) box.innerHTML = '';
      const wasNearBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 60;
      box.insertAdjacentHTML('beforeend', renderChatMessageHtml(message, room));
      if (wasNearBottom || message.user_email === ((__user && __user.email) || '')) {
        box.scrollTop = box.scrollHeight;
        // 图片异步解码会撑高内容，稍后补滚一次以停留在最新
        setTimeout(() => { box.scrollTop = box.scrollHeight; }, 120);
      }
    }

    // 历史分页：把更早的消息插入到列表顶部，并维持用户当前阅读位置
    function prependChatHistory(list, room) {
      const box = document.getElementById('chatMessages');
      if (!box || !list || !list.length) { chatHasMore[room] = false; return; }
      // list 为降序（最新在前），转成升序以便按时间顺序插入顶部
      const ordered = list.slice().reverse();
      const prevHeight = box.scrollHeight;
      const prevTop = box.scrollTop;
      const html = ordered.map(m => renderChatMessageHtml(m, room)).join('');
      box.insertAdjacentHTML('afterbegin', html);
      // 补偿：顶部插入后，把滚动位置下移新增高度，避免画面跳动
      box.scrollTop = prevTop + (box.scrollHeight - prevHeight);
      const minTs = ordered.reduce((mn, m) => Math.min(mn, m.created_at ? new Date(m.created_at).getTime() : 0), Infinity);
      chatOldestTs[room] = Math.min(chatOldestTs[room] || Infinity, minTs);
      chatHasMore[room] = list.length >= 30;
    }

    function renderChatMessages(list, room, isFirst) {
      const box = document.getElementById('chatMessages');
      if (!box) return;
      if (list.length === 0) {
        box.innerHTML = '<div class="chat-empty">暂无消息，来做第一个发言的人吧～</div>';
        return;
      }

      const html = list.map(m => renderChatMessageHtml(m, room)).join('');
      box.innerHTML = html;
      // 首屏始终滚到最新；图片是 base64 异步解码，会撑高内容，故多次兜底滚动
      const scrollToBottom = () => { box.scrollTop = box.scrollHeight; };
      if (isFirst) {
        chatSuppressHistoryUntil = Date.now() + 1500;
        scrollToBottom();
        requestAnimationFrame(scrollToBottom);
        setTimeout(scrollToBottom, 60);
        setTimeout(scrollToBottom, 300);
        setTimeout(scrollToBottom, 700);
        setTimeout(() => {
          scrollToBottom();
          chatSuppressHistoryUntil = 0;
        }, 1200);
      }
    }

    function setChatQuote(message) {
      if (!message || !message.id) return;
      pendingChatQuote = {
        id: message.id,
        nickname: message.user_nickname || message.user_email?.split('@')[0] || '群友',
        content: (message.content || '').trim(),
        image: message.image || ''
      };
      const preview = document.getElementById('chatQuotePreview');
      const name = document.getElementById('chatQuotePreviewName');
      const text = document.getElementById('chatQuotePreviewText');
      if (name) name.textContent = pendingChatQuote.nickname;
      if (text) text.textContent = pendingChatQuote.content || (pendingChatQuote.image ? '[图片]' : '[空消息]');
      if (preview) preview.hidden = false;
      const input = document.getElementById('chatInput');
      if (input) {
        input.placeholder = `回复 ${pendingChatQuote.nickname}…`;
        input.focus();
      }
    }

    function clearChatQuote() {
      pendingChatQuote = null;
      const preview = document.getElementById('chatQuotePreview');
      if (preview) preview.hidden = true;
      const input = document.getElementById('chatInput');
      if (input) input.placeholder = '文明发言，禁止荐股与广告…';
    }

    function bindChatQuoteActions() {
      const box = document.getElementById('chatMessages');
      if (!box || box.__chatQuoteBound) return;
      let pressTimer = null;
      let pressTarget = null;
      const cancel = () => {
        if (pressTimer) clearTimeout(pressTimer);
        pressTimer = null;
        pressTarget = null;
      };
      const trigger = (target) => {
        const msgEl = target && target.closest('.chat-msg-other');
        if (!msgEl) return;
        const id = msgEl.getAttribute('data-message-id');
        const room = msgEl.getAttribute('data-room');
        const message = chatMessageCache.get(`${room}:${id}`);
        if (message) {
          setChatQuote(message);
          msgEl.classList.add('chat-msg-quoted');
          setTimeout(() => msgEl.classList.remove('chat-msg-quoted'), 500);
        }
      };
      box.addEventListener('pointerdown', (event) => {
        const msgEl = event.target.closest('.chat-msg-other');
        if (!msgEl || event.target.closest('.chat-quoted-message')) return;
        pressTarget = event.target;
        pressTimer = setTimeout(() => { trigger(pressTarget); cancel(); }, 550);
      });
      ['pointerup', 'pointercancel', 'pointerleave'].forEach(type => box.addEventListener(type, cancel));
      box.addEventListener('contextmenu', (event) => {
        if (event.target.closest('.chat-msg-other')) event.preventDefault();
      });
      box.addEventListener('click', (event) => {
        const quoted = event.target.closest('.chat-quoted-message');
        if (!quoted) return;
        const quoteId = quoted.dataset.quoteId || '';
        const target = Array.from(box.querySelectorAll('.chat-msg')).find(el => el.getAttribute('data-message-id') === quoteId);
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
      box.__chatQuoteBound = true;
    }

    async function recallChatMessage(messageId) {
      if (!messageId || !__user.loggedIn) return;
      if (!confirm('确定撤回这条消息吗？2分钟内可以撤回。')) return;
      try {
        const d = await sbRpc('recall_message', { p_token: __user.token, p_message_id: messageId });
        if (d && d.ok) {
          // 就地把这条改成“已撤回”，不再整列表重载
          const box = document.getElementById('chatMessages');
          const node = box && box.querySelector('[data-message-id="' + String(messageId).replace(/"/g, '\\"') + '"]');
          const cached = chatMessageCache.get(`${currentRoom}:${messageId}`);
          if (node && cached) {
            node.outerHTML = renderChatMessageHtml(Object.assign({}, cached, { recalled_at: new Date().toISOString() }), currentRoom);
          } else {
            loadChatMessages(currentRoom, { isFirst: true });
          }
        } else {
          alert('撤回失败：' + ((d && (d.msg || d.message)) || '消息可能已超过2分钟'));
        }
      } catch (e) {
        alert('撤回失败：' + (e && e.message ? e.message : '请检查网络'));
      }
    }

    async function sendChatMessage() {
      if (!__user.loggedIn) { openAuthModal(); return; }
      if (currentRoom === 'vip' && !__user.isVip) { openRedeemModal(); return; }

      const input = document.getElementById('chatInput');
      const content = (input.value || '').trim();
      const image = pendingChatImage;

      if (!content && !image) return;
      if (content.length > 500) { alert('单条消息最多 500 字'); return; }

      const room = currentRoom;
      const quote = pendingChatQuote;
      const payload = {
        p_token: __user.token,
        p_room: room,
        p_content: content,
        p_image: image || null,
        p_reply_to_id: quote && quote.id ? quote.id : null
      };
      const tempId = 'pending-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7);
      const optimistic = {
        id: tempId,
        user_email: __user.email,
        user_nickname: __user.nickname || __user.email?.split('@')[0] || '我',
        content,
        image,
        reply_to_id: quote && quote.id ? quote.id : null,
        reply_to_nickname: quote && quote.nickname ? quote.nickname : null,
        reply_to_content: quote && quote.content ? quote.content : null,
        reply_to_image: quote && quote.image ? quote.image : null,
        created_at: new Date().toISOString(),
        __pending: true,
        __sendState: '发送中…'
      };
      const key = chatSendKey(room, content, image);

      // 乐观渲染：先清空输入框并立即上屏，用户无需等待网络往返
      input.value = '';
      clearChatImage();
      clearChatQuote();
      chatPendingSends.set(tempId, { key, room, message: optimistic, payload, createdAt: Date.now(), delivering: false, attempts: 0 });
      chatPendingKeys.set(key, tempId);
      try {
        appendChatMessage(optimistic, room);
      } catch (e) {
        console.error('[chat] optimistic append failed, continue delivery', e);
      }

      // 后台发送，不阻塞输入框；发送按钮保持可用，允许连续发言
      updateChatPendingState(tempId, '发送中…');
      deliverChatMessage(tempId);
      window.setTimeout(() => deliverChatMessage(tempId), 800);
      window.setTimeout(() => {
        if (chatPendingSends.has(tempId)) markChatSendFailed(tempId, '发送超时，请点重试');
      }, 18000);
    }

    // 实际把消息发到服务器，成功后把本地占位消息替换为真实消息
    async function deliverChatMessage(tempId) {
      const task = chatPendingSends.get(tempId);
      if (!task) return;
      if (task.delivering) return;
      task.delivering = true;
      task.attempts = (task.attempts || 0) + 1;
      task.lastAttemptAt = Date.now();
      console.log('[chat] deliverChatMessage start', tempId, 'attempt=', task.attempts);
      updateChatPendingState(tempId, task.attempts > 1 ? '重试发送中…' : '发送中…');
      try {
        // 写操作可能受 Supabase 冷启动/网络影响而变慢，加超时兜底：
        // 避免 fetch 挂起导致气泡永久停在“发送中…”。超时则转失败可重试。
        const d = await sbRpc('send_message', task.payload, { timeoutMs: 15000 });
        console.log('[chat] send_message response', d);
        if (d && d.ok) {
          updateChatPendingState(tempId, '发送成功…');
          triggerChatPushNotification(task).catch(e => console.warn('[chat] push notify failed', e));
          finalizeChatSend(tempId, d.id || d.message_id || null);
        } else {
          const status = (d && d._status) ? ' [HTTP ' + d._status + ']' : '';
          const detail = d && (d.msg || d.message || d.error || d.details || (d._raw ? d._raw.slice(0, 200) : JSON.stringify(d)));
          markChatSendFailed(tempId, (detail || '未知错误') + status);
        }
      } catch (e) {
        console.error('[chat] deliverChatMessage error', e);
        markChatSendFailed(tempId, (e && e.message) ? e.message : '网络异常');
      } finally {
        const latest = chatPendingSends.get(tempId);
        if (latest) latest.delivering = false;
      }
    }

    function updateChatPendingState(tempId, text) {
      const task = chatPendingSends.get(tempId);
      if (task && task.message) task.message.__sendState = text;
      const box = document.getElementById('chatMessages');
      const node = box && box.querySelector('[data-message-id="' + tempId + '"]');
      const state = node && node.querySelector('.chat-msg-state');
      if (state) state.textContent = text;
    }

    function startChatSendWatchdog() {
      if (chatSendWatchdogTimer) clearInterval(chatSendWatchdogTimer);
      chatSendWatchdogTimer = setInterval(() => {
        const now = Date.now();
        chatPendingSends.forEach((task, tempId) => {
          if (!task || task.message.__failed) return;
          const age = now - (task.createdAt || now);
          const lastAttemptAge = now - (task.lastAttemptAt || 0);
          if (!task.delivering && (!task.lastAttemptAt || lastAttemptAge > 5000) && (task.attempts || 0) < 2) {
            console.warn('[chat] watchdog redeliver pending send', tempId, 'age=', age);
            deliverChatMessage(tempId);
            return;
          }
          if (age > 20000) {
            markChatSendFailed(tempId, '发送超时，请点重试');
          }
        });
      }, 2000);
    }

    // 发送成功：把占位消息就地换成带真实 id 的消息（可撤回、可被引用）
    function finalizeChatSend(tempId, realId) {
      const task = chatPendingSends.get(tempId);
      chatPendingSends.delete(tempId);
      if (task) chatPendingKeys.delete(task.key);
      if (!task) return;
      const box = document.getElementById('chatMessages');
      if (!box) return;
      const node = box.querySelector('[data-message-id="' + tempId + '"]');
      if (!node) return;
      // 轮询可能已把真实消息追加进来，此时直接移除占位，避免重复
      if (realId && box.querySelector('[data-message-id="' + String(realId).replace(/"/g, '\\"') + '"]')) {
        node.remove();
        return;
      }
      const finalMessage = Object.assign({}, task.message, { id: realId || task.message.id, __pending: false });
      node.outerHTML = renderChatMessageHtml(finalMessage, task.room);
      if (realId) lastSeenTs[task.room] = Math.max(lastSeenTs[task.room] || 0, new Date(finalMessage.created_at).getTime());
    }

    // 发送失败：占位消息标红并提供重试，不丢用户内容
    function markChatSendFailed(tempId, detail) {
      const task = chatPendingSends.get(tempId);
      if (!task) return;
      task.message.__pending = false;
      task.message.__failed = true;
      task.message.__sendState = '';
      task.delivering = false;
      task.error = detail;
      const box = document.getElementById('chatMessages');
      const node = box && box.querySelector('[data-message-id="' + tempId + '"]');
      if (node) node.outerHTML = renderChatMessageHtml(task.message, task.room);
      console.warn('[chat] send failed:', detail);
    }

    // 点“重试”重新投递同一条消息
    function retryChatSend(tempId) {
      const task = chatPendingSends.get(tempId);
      if (!task) return;
      task.message.__failed = false;
      task.message.__pending = true;
      task.createdAt = Date.now();
      task.delivering = false;
      task.lastAttemptAt = 0;
      const box = document.getElementById('chatMessages');
      const node = box && box.querySelector('[data-message-id="' + tempId + '"]');
      if (node) node.outerHTML = renderChatMessageHtml(task.message, task.room);
      deliverChatMessage(tempId);
    }

    function onChatImageSelected(input) {
      const file = input.files && input.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) { alert('请选择图片文件'); input.value = ''; return; }
      if (file.size > 8 * 1024 * 1024) { alert('图片最大支持 8MB'); input.value = ''; return; }

      // 压缩：最大宽度 720，质量 0.7，控制 base64 在合理范围
      compressChatImage(file, 720, 0.7).then(({ base64, name }) => {
        // base64 超过 600KB 时再次压缩
        const roughSize = Math.round(base64.length * 0.75);
        if (roughSize > 600 * 1024) {
          return compressChatImage(file, 480, 0.6);
        }
        return { base64, name };
      }).then(({ base64, name }) => {
        const finalSize = Math.round(base64.length * 0.75);
        if (finalSize > 1 * 1024 * 1024) {
          throw new Error('图片压缩后仍超过 1MB，请换一张更小的图片');
        }
        pendingChatImage = base64;
        const thumb = document.getElementById('chatImgPreviewThumb');
        const preview = document.getElementById('chatImgPreview');
        const nameEl = document.getElementById('chatImgPreviewName');
        if (thumb) thumb.src = base64;
        if (nameEl) nameEl.textContent = name;
        if (preview) preview.classList.add('active');
      }).catch(err => {
        alert('图片处理失败: ' + (err && err.message || '未知错误'));
        clearChatImage();
      }).finally(() => { input.value = ''; });
    }

    function clearChatImage() {
      pendingChatImage = null;
      const preview = document.getElementById('chatImgPreview');
      const thumb = document.getElementById('chatImgPreviewThumb');
      if (preview) preview.classList.remove('active');
      if (thumb) thumb.src = '';
      const input = document.getElementById('chatImgInput');
      if (input) input.value = '';
    }

    function compressChatImage(file, maxWidth, quality) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let { width, height } = img;
            if (width > maxWidth) {
              height = Math.round(height * maxWidth / width);
              width = maxWidth;
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            const base64 = canvas.toDataURL('image/jpeg', quality);
            resolve({ base64, name: file.name, width, height });
          };
          img.onerror = () => reject(new Error('图片加载失败'));
          img.src = e.target.result;
        };
        reader.onerror = () => reject(new Error('图片读取失败'));
        reader.readAsDataURL(file);
      });
    }

    function startChatPoll() {
      if (chatPollTimer) clearInterval(chatPollTimer);
      chatPollTimer = setInterval(() => {
        // VIP 房间未解锁时不轮询
        if (currentRoom === 'vip' && (!__user.loggedIn || !__user.isVip)) return;
        loadChatMessages(currentRoom);
      }, 5000);
    }

    // ===== 新消息提醒 =====
    function initChatNotification() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js?v=2026082028').then(() => {
          refreshChatPushSubscription();
        }).catch(() => {});
      }
      inAppNotifOn = localStorage.getItem('blys_notif_inapp') === 'on';
      notifEnabled = false;
      updateNotifBtn();
      if (inAppNotifOn && typeof Notification !== 'undefined' && Notification.permission === 'granted') {
        setTimeout(refreshChatPushSubscription, 500);
      }
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) return;
        inAppNotifOn = localStorage.getItem('blys_notif_inapp') === 'on';
        if (!notifEnabled) refreshChatPushSubscription();
        updateNotifBtn();
        // 回到页面：展示未读横幅
        showUnreadBanner();
        loadChatMessages(currentRoom);
      });
    }

    function supportsSystemPush() {
      return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
    }

    function getNotifErrorText(err) {
      const name = err && err.name ? String(err.name) : '';
      const msg = err && err.message ? String(err.message) : '';
      if (!supportsSystemPush()) return '当前环境不支持系统弹窗推送';
      if (typeof Notification !== 'undefined' && Notification.permission === 'denied') return '系统通知权限已被禁止';
      if (msg.includes('SW rebuild failed')) return '重建推送组件失败' + (name ? '（' + name + '）' : '');
      if (msg.includes('SW ready failed')) return '读取推送组件失败' + (name ? '（' + name + '）' : '');
      if (msg.includes('Get subscription failed')) return '读取旧推送订阅失败' + (name ? '（' + name + '）' : '');
      if (msg.includes('不支持系统推送')) return '当前浏览器不支持系统弹窗推送';
      if (msg.includes('请先登录')) return '请先登录后再开启提醒';
      if (msg.includes('没有允许浏览器通知权限')) return '系统通知权限没有允许';
      if (msg.includes('订阅保存失败')) return '推送订阅保存失败，服务器没有记住这台手机';
      if (msg.includes('Registration failed')) return '浏览器注册系统弹窗失败' + (name ? '（' + name + '）' : '');
      if (msg.includes('Subscription failed')) return '浏览器创建推送订阅失败' + (name ? '（' + name + '）' : '');
      if (msg.includes('Permission denied')) return '系统通知权限没有允许';
      return '系统弹窗开启失败，已退回页内提醒' + (name ? '（' + name + '）' : '');
    }

    function setNotifDiag(msg) {
      notifDiagMsg = msg || '';
      const el = document.getElementById('chatNotifDiag');
      if (!el) return;
      el.textContent = notifDiagMsg;
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
      return outputArray;
    }

    async function saveChatPushSubscription(subscription) {
      if (!subscription || !__user.loggedIn || !__user.token) return false;
      const d = await sbRpc('save_push_subscription', {
        p_token: __user.token,
        p_subscription: subscription.toJSON(),
        p_user_agent: navigator.userAgent || ''
      }, { timeoutMs: 10000 });
      return !!(d && d.ok);
    }

    async function clearChatPushSubscription(reg) {
      try {
        const sub = await reg.pushManager.getSubscription();
        if (!sub) return;
        const endpoint = sub.endpoint;
        await sub.unsubscribe();
        if (__user && __user.loggedIn && __user.token && endpoint) {
          await sbRpc('delete_push_subscription', { p_token: __user.token, p_endpoint: endpoint }, { timeoutMs: 8000 });
        }
      } catch (e) {
        console.warn('[chat] clear push subscription failed', e);
      }
    }

    async function rebuildChatServiceWorker() {
      if (!('serviceWorker' in navigator)) return navigator.serviceWorker.ready;
      try {
        const regs = await navigator.serviceWorker.getRegistrations();
        for (const reg of regs) {
          const url = reg.active && reg.active.scriptURL ? reg.active.scriptURL : '';
          const waiting = reg.waiting && reg.waiting.scriptURL ? reg.waiting.scriptURL : '';
          const installing = reg.installing && reg.installing.scriptURL ? reg.installing.scriptURL : '';
          const hit = [url, waiting, installing].some((s) => String(s).includes('/sw.js'));
          if (hit) {
            try { await clearChatPushSubscription(reg); } catch (e) {}
            try { await reg.unregister(); } catch (e) {}
          }
        }
      } catch (e) {
        console.warn('[chat] rebuild service worker scan failed', e);
      }
      try {
        return await navigator.serviceWorker.register('sw.js?v=2026082028');
      } catch (e) {
        throw new Error('SW rebuild failed: ' + ((e && e.message) ? e.message : 'unknown'));
      }
    }

    async function subscribeChatPush(retryMode) {
      if (!supportsSystemPush()) throw new Error('当前浏览器不支持系统推送');
      if (!__user.loggedIn || !__user.token) throw new Error('请先登录后再开启提醒');
      const permission = Notification.permission === 'granted'
        ? 'granted'
        : await Notification.requestPermission();
      if (permission !== 'granted') throw new Error('你没有允许浏览器通知权限');

      let reg;
      try {
        reg = await navigator.serviceWorker.ready;
      } catch (e) {
        throw new Error('SW ready failed: ' + ((e && e.message) ? e.message : 'unknown'));
      }
      try {
        let sub;
        try {
          sub = await reg.pushManager.getSubscription();
        } catch (e) {
          throw new Error('Get subscription failed: ' + ((e && e.message) ? e.message : 'unknown'));
        }
        if (!sub) {
          try {
            sub = await reg.pushManager.subscribe({
              userVisibleOnly: true,
              applicationServerKey: urlBase64ToUint8Array(PUSH_VAPID_PUBLIC_KEY)
            });
          } catch (e) {
            throw new Error('Subscription failed: ' + ((e && e.message) ? e.message : 'unknown'));
          }
        }
        const saved = await saveChatPushSubscription(sub);
        if (!saved) throw new Error('订阅保存失败，请确认已执行 push_upgrade.sql');
        return sub;
      } catch (e) {
        if (retryMode === 'after-reset') throw e;
        console.warn('[chat] subscribe failed, retry after reset', e);
        await clearChatPushSubscription(reg);
        await rebuildChatServiceWorker();
        return subscribeChatPush('after-reset');
      }
    }

    async function unsubscribeChatPush() {
      if (!supportsSystemPush() || !__user.loggedIn || !__user.token) return;
      try {
        const reg = await navigator.serviceWorker.ready;
        const sub = await reg.pushManager.getSubscription();
        if (!sub) return;
        const endpoint = sub.endpoint;
        await sub.unsubscribe();
        await sbRpc('delete_push_subscription', { p_token: __user.token, p_endpoint: endpoint }, { timeoutMs: 8000 });
      } catch (e) {
        console.warn('[chat] unsubscribe push failed', e);
      }
    }

    async function refreshChatPushSubscription() {
      if (!supportsSystemPush()) return;
      if (localStorage.getItem('blys_notif') !== 'on' && localStorage.getItem('blys_notif_inapp') !== 'on') return;
      if (Notification.permission !== 'granted') return;
      if (!__user.loggedIn || !__user.token) return;
      try {
        await subscribeChatPush();
        notifEnabled = true;
        localStorage.setItem('blys_notif', 'on');
        setNotifDiag('系统弹窗提醒已开启');
        updateNotifBtn();
      } catch (e) {
        notifEnabled = false;
        setNotifDiag(getNotifErrorText(e));
        console.warn('[chat] refresh push subscription failed', e);
        updateNotifBtn();
      }
    }

    function getBrowserTip() {
      const ua = navigator.userAgent || '';
      const isWeChat = /MicroMessenger/i.test(ua);
      const isQQ = /QQ\//i.test(ua) || /Qzone/i.test(ua);
      const isTikTok = /douyin|aweme|tiktok/i.test(ua);
      if (isWeChat) return '微信内置浏览器不支持网页通知。请点右上角「···」→「在浏览器打开」，用 Chrome/Edge 打开本页后开启提醒，或把站点「添加到桌面」作为 App 使用。';
      if (isQQ) return 'QQ 内置浏览器不支持网页通知。请在系统浏览器（Chrome/Edge）中打开本页后开启提醒。';
      if (isTikTok) return '抖音内置浏览器不支持网页通知。请在系统浏览器（Chrome/Edge）中打开本页后开启提醒。';
      return '你的浏览器（OPPO/vivo/小米等手机自带浏览器）默认关闭了网页通知接口，系统级弹窗无法开启。可改用手机上的 Chrome 或 Edge 打开本页并「添加到桌面」，即可收到锁屏弹窗；或直接开启「页内提醒」，离开再回来时会看到未读提示。';
    }

    function getBrowserName() {
      const ua = navigator.userAgent || '';
      if (/MicroMessenger/i.test(ua)) return '微信';
      if (/QQ\//i.test(ua) || /Qzone/i.test(ua)) return 'QQ';
      if (/douyin|aweme|tiktok/i.test(ua)) return '抖音';
      if (/Oppo|ColorOS/i.test(ua)) return 'OPPO 自带浏览器';
      if (/vivo/i.test(ua)) return 'vivo 自带浏览器';
      if (/Miui|Redmi|Xiaomi/i.test(ua)) return '小米自带浏览器';
      if (/Huawei|Harmony/i.test(ua)) return '华为浏览器';
      if (/Chrome/i.test(ua)) return 'Chrome';
      if (/Edg/i.test(ua)) return 'Edge';
      return '当前浏览器';
    }

    function updateNotifBtn() {
      const btn = document.getElementById('chatNotifBtn');
      if (!btn) return;
      if (notifEnabled) {
        btn.textContent = '🔔 已开启';
        btn.classList.add('on');
        btn.title = '系统弹窗提醒已开启';
        setNotifDiag('系统弹窗提醒已开启');
        return;
      }
      // 优先显示「页内提醒」状态（任何浏览器都生效，且可持久化）
      if (inAppNotifOn) {
        btn.textContent = '📬 页内提醒';
        btn.classList.add('on');
        btn.title = '页内未读提醒已开启（切走再回来会看到未读横幅）';
        if (!notifDiagMsg) setNotifDiag('当前只开启了页内提醒');
        return;
      }
      // 未开启
      if (typeof Notification !== 'undefined' && Notification.permission === 'denied') {
        btn.textContent = '🔕 已禁止';
        setNotifDiag('系统通知权限已被禁止');
      } else {
        btn.textContent = '🔔 开启提醒';
        if (!notifDiagMsg) setNotifDiag('');
      }
      btn.classList.remove('on');
      btn.title = '新消息弹窗提醒 / 页内提醒';
    }

    async function toggleChatNotification() {
      if (notifEnabled || inAppNotifOn) {
        // 关闭提醒
        inAppNotifOn = false;
        localStorage.setItem('blys_notif_inapp', 'off');
        notifEnabled = false;
        localStorage.setItem('blys_notif', 'off');
        setNotifDiag('');
        unsubscribeChatPush();
        updateNotifBtn();
        return;
      }
      if (!__user.loggedIn) {
        openAuthModal();
        return;
      }

      // 开启：优先尝试系统 Web Push，失败再退回页内提醒
      inAppNotifOn = true;
      localStorage.setItem('blys_notif_inapp', 'on');
      try {
        await subscribeChatPush();
        notifEnabled = true;
        localStorage.setItem('blys_notif', 'on');
        setNotifDiag('系统弹窗提醒已开启');
      } catch (e) {
        console.warn('[chat] system push unavailable', e);
        notifEnabled = false;
        localStorage.setItem('blys_notif', 'off');
        setNotifDiag(getNotifErrorText(e));
      }
      updateNotifBtn();
      unreadCounts = { public: 0, vip: 0 };
      updateUnreadBadges();
      if (!notifEnabled) {
        const bname = getBrowserName();
        alert('已开启「页内提醒」。' + bname + '暂时无法开启系统弹窗，但你切走再回来时，会看到未读横幅和频道红点提醒。\n\n想收到真正的锁屏弹窗，请用手机上的 Edge/Chrome 打开本页并「添加到桌面」，允许通知权限后再开启提醒。');
      }
    }

    function dismissUnreadBanner() {
      const banner = document.getElementById('chatUnreadBanner');
      if (banner) banner.hidden = true;
      unreadCounts = { public: 0, vip: 0 };
      updateUnreadBadges();
      const box = document.getElementById('chatMessages');
      if (box) box.scrollTop = box.scrollHeight;
    }

    function showUnreadBanner() {
      const total = (Number(unreadCounts.public) || 0) + (Number(unreadCounts.vip) || 0);
      const banner = document.getElementById('chatUnreadBanner');
      if (!banner) return;
      if (inAppNotifOn && total > 0) {
        document.getElementById('chatUnreadCount').textContent = total;
        banner.hidden = false;
      } else {
        banner.hidden = true;
      }
    }

    function updateUnreadBadges() {
      ['public', 'vip'].forEach(room => {
        const el = document.getElementById('badge-' + room);
        if (!el) return;
        const n = unreadCounts[room] || 0;
        if (n > 0) {
          el.textContent = n > 99 ? '99+' : n;
          el.hidden = false;
        } else {
          el.hidden = true;
        }
      });
      // 未读变化后同步横幅：未读为 0 则横幅自动隐藏
      showUnreadBanner();
    }

    async function notifyNewMessage(room, name, preview, count) {
      const title = room === 'vip' ? '⭐ 会员群聊 · 白鹿原上' : '🌐 注册群聊 · 白鹿原上';
      const body = (count > 1 ? `[${count}条新消息] ` : '') + name + '：' + preview;
      try {
        if ('serviceWorker' in navigator) {
          const reg = await navigator.serviceWorker.ready;
          await reg.showNotification(title, { body, icon: '/assets/favicon.png', badge: '/assets/favicon.png', tag: 'blys-chat', data: { url: '/chat.html' } });
          return;
        }
      } catch (e) { /* 回退到普通通知 */ }
      try { new Notification(title, { body }); } catch (e) { /* 忽略 */ }
    }

    async function triggerChatPushNotification(task) {
      if (!task || !task.payload || !__user.loggedIn || !__user.token) return;
      await callEdge('notify-chat', {
        token: __user.token,
        room: task.room,
        content: task.payload.p_content || '',
        image: !!task.payload.p_image
      });
    }

    // 页面离开时清理轮询
    window.addEventListener('beforeunload', () => {
      if (chatPollTimer) clearInterval(chatPollTimer);
      if (chatOnlineTimer) clearInterval(chatOnlineTimer);
      if (chatHeartbeatTimer) clearInterval(chatHeartbeatTimer);
      if (chatSendWatchdogTimer) clearInterval(chatSendWatchdogTimer);
    });
  </script>
