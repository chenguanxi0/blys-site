<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理后台 · 白鹿原上-交易笔记</title>
  <link rel="stylesheet" href="assets/styles.css?v=2026082426" />
  <style>
    body { background:#f1f5f9; }
    .admin { max-width:1000px; margin:0 auto; padding:30px 16px 60px; }
    .admin h1 { font-size:24px; margin-bottom:6px; }
    .admin .sub { color:var(--muted); margin-bottom:24px; }
    .login-box { background:#fff; padding:24px; border-radius:12px; max-width:360px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
    .login-box input { width:100%; padding:10px; margin:10px 0; border:1px solid #d1d5db; border-radius:8px; }
    .stat-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:24px; }
    .stat-card { background:#fff; border-radius:12px; padding:20px; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.06); }
    .stat-card .num { font-size:30px; font-weight:700; color:var(--brand); }
    .stat-card .lbl { color:var(--muted); font-size:13px; margin-top:4px; }
    .panel { background:#fff; border-radius:12px; padding:20px; margin-bottom:24px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
    .panel h2 { font-size:18px; margin-top:0; margin-bottom:14px; }
    .table-wrap { overflow-x: auto; border-radius:8px; border:1px solid #e5e7eb; }
    .admin-table { width:100%; border-collapse:collapse; font-size:12px; min-width:680px; }
    .admin-table th,.admin-table td { border:1px solid #e5e7eb; padding:6px 8px; text-align:left; vertical-align:middle; }
    .admin-table th { background:#f9fafb; font-size:12px; white-space:nowrap; }
    .admin-table td { white-space:nowrap; }
    .admin-table td.wrap { white-space:normal; min-width:120px; }
    .admin-table td.email { font-size:11px; color:#555; max-width:140px; overflow:hidden; text-overflow:ellipsis; }
    .admin-table button { padding:2px 8px; border:none; background:var(--brand); color:#fff; border-radius:4px; cursor:pointer; font-size:12px; white-space:nowrap; }
    .admin-table button.danger { background:#dc2626; }
    .admin-table .badge { display:inline-block; padding:1px 6px; border-radius:4px; font-size:11px; background:#f3f4f6; color:#666; }
    .admin-table tr.vip-expiring td { background:#fff7ed; }
    .admin-table tr.vip-expired td { background:#fef2f2; }
    .vip-remain { font-weight:700; }
    .vip-remain.warn { color:#ea580c; }
    .vip-remain.expired { color:#dc2626; }
    .cmt-bar { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; align-items:center; }
    .cmt-bar input, .cmt-bar select { padding:6px 10px; border:1px solid #d1d5db; border-radius:6px; font-size:13px; }
    .cmt-bar input { flex:1; min-width:150px; }
    .admin-table button.secondary { background:#475569; }
    .admin-table button.renew { background:#16a34a; margin-left:6px; }
    .monthly-stat-input { width:88px; padding:6px 8px; border:1px solid #d1d5db; border-radius:6px; font-size:13px; }
    .monthly-stat-total td { background:#f8fafc; font-weight:800; }
    .admin-form { display:grid; gap:10px; }
    .admin-form label { display:flex; flex-direction:column; gap:6px; font-size:13px; color:#64748b; }
    .admin-form input, .admin-form textarea { width:100%; padding:10px 12px; border:1px solid #d1d5db; border-radius:8px; font-size:14px; font-family:inherit; }
    .admin-form textarea { min-height:110px; resize:vertical; line-height:1.6; }
    .admin-form-actions { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .admin-save-msg { color:#64748b; font-size:13px; }
    .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; align-items:center; justify-content:center; z-index:100; }
    .modal-backdrop.open { display:flex; }
    .modal-box { background:#fff; border-radius:12px; padding:24px; width:90%; max-width:360px; box-shadow:0 8px 30px rgba(0,0,0,.15); }
    .modal-box h3 { margin:0 0 12px; }
    .modal-box input[type="date"] { width:100%; padding:10px; border:1px solid #d1d5db; border-radius:8px; font-size:14px; margin:10px 0; }
    .modal-box .row { display:flex; gap:10px; margin-top:14px; }
    .modal-box .row button { flex:1; padding:10px; border-radius:8px; border:none; cursor:pointer; font-size:14px; }
    .modal-box .row .cancel { background:#f3f4f6; color:#333; }
    .modal-box .row .confirm { background:var(--brand); color:#fff; }
    .back-home { display:inline-block; margin-bottom:16px; color:var(--brand); }
  </style>
</head>
<body>
  <main class="admin">
    <a class="back-home" href="index.html">← 返回站点首页</a>
    <h1>🛡 管理后台</h1>
    <p class="sub">用户管理 · 会员发放 · 评论管理 · 数据概览</p>

    <div class="login-box" id="loginBox">
      <label>管理员密码</label>
      <input type="password" id="adminPw" placeholder="请输入管理后台密码" />
      <button class="btn btn-primary btn-block" onclick="doAdminLogin()">登录</button>
      <p id="adminMsg" class="result"></p>
    </div>

    <div id="dash" style="display:none">
      <div class="stat-grid">
        <div class="stat-card"><div class="num" id="statUsers">-</div><div class="lbl">注册用户</div></div>
        <div class="stat-card"><div class="num" id="statVip">-</div><div class="lbl">会员数</div></div>
        <div class="stat-card"><div class="num" id="statCmts">-</div><div class="lbl">评论数</div></div>
      </div>

      <div class="panel">
        <div class="admin-form-actions" style="justify-content:space-between;margin-bottom:14px;">
          <h2 style="margin:0;">月度会员数量统计</h2>
          <button class="btn btn-secondary" id="monthlyMemberStatsToggle" onclick="toggleMonthlyMemberStats()">展开</button>
        </div>
        <div class="table-wrap" id="monthlyMemberStats">加载中...</div>
      </div>

      <div class="panel">
        <h2>📣 网站公告</h2>
        <div class="admin-form">
          <label>标题<input id="siteAnnouncementTitle" type="text" placeholder="例如：网站公告"></label>
          <label>完整内容<textarea id="siteAnnouncementContent" placeholder="公告完整内容，可以写长一点；通知栏默认只展示第一行"></textarea></label>
          <div class="admin-form-actions">
            <button class="btn btn-primary" onclick="saveSiteAnnouncement()">保存公告</button>
            <button class="btn btn-secondary" onclick="clearSiteAnnouncement()">清空公告</button>
            <button class="btn btn-secondary" onclick="loadSiteAnnouncementAdmin()">刷新</button>
            <span class="admin-save-msg" id="siteAnnouncementMsg"></span>
          </div>
        </div>
      </div>

      <div class="panel">
        <h2>👥 用户列表</h2>
        <div class="table-wrap" id="userList">加载中…</div>
      </div>

      <div class="panel">
        <h2>💬 评论管理</h2>
        <div class="cmt-bar">
          <select id="cmtFilter" onchange="renderComments()">
            <option value="">全部文章</option>
            <option value="__reviews">复盘评论</option>
            <option value="market-overview">市场大局观</option>
            <option value="trading-mindset">四种心态</option>
          </select>
          <input type="text" id="cmtSearch" placeholder="搜索评论内容或昵称…" oninput="renderComments()">
          <button class="btn btn-primary" onclick="loadComments()">刷新</button>
        </div>
        <div class="table-wrap" id="commentList">加载中…</div>
      </div>
    </div>
  </main>

  <!-- 设会员弹窗 -->
  <div class="modal-backdrop" id="vipModal">
    <div class="modal-box">
      <h3>设置会员到期时间</h3>
      <p style="font-size:13px;color:#666;margin:0 0 8px;">选择到期日期，系统会自动计算天数</p>
      <input type="date" id="vipModalDate" />
      <div class="row">
        <button class="cancel" onclick="closeVipModal()">取消</button>
        <button class="confirm" onclick="confirmVipDate()">确认</button>
      </div>
    </div>
  </div>

  <script>
    const SB_URL = "https://ojioiglffglyuellvcex.supabase.co";
    const SB_ANON = "sb_publishable_rGCr3ILVWQpvpURhctuYQg_K_jC-WHV";
    const ADMIN_TOKEN_KEY = "blys_admin_token";
    const MONTHLY_MEMBER_STATS_KEY = "blys_admin_monthly_member_stats_v1";
    let monthlyMemberStatsExpanded = false;

    async function sbRpc(fn, params){
      const r = await fetch(SB_URL + "/rest/v1/rpc/" + fn, {
        method:"POST",
        headers:{ "Content-Type":"application/json", "apikey":SB_ANON, "Authorization":"Bearer "+SB_ANON },
        body: JSON.stringify(params||{})
      });
      return r.json();
    }
    function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;","&gt;":"&gt;","\"":"&quot;"}[c])); }
    function fmt(dt){ const d=new Date(dt); if(isNaN(d))return"-"; const p=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes()); }
    function vipDays(start){
      const s = start ? new Date(start) : null;
      if(!s || isNaN(s)) return '-';
      return Math.max(1, Math.floor((Date.now() - s.getTime()) / 86400000) + 1) + ' 天';
    }
    function vipRemainDays(expire){
      const e = expire ? new Date(expire) : null;
      if(!e || isNaN(e)) return '-';
      const days = Math.ceil((e.getTime() - Date.now()) / 86400000);
      return days > 0 ? (days + ' 天') : '已到期';
    }
    function vipRemainNumber(expire){
      const e = expire ? new Date(expire) : null;
      if(!e || isNaN(e)) return null;
      return Math.ceil((e.getTime() - Date.now()) / 86400000);
    }
    function vipRemainClass(expire){
      const days = vipRemainNumber(expire);
      if(days == null) return '';
      if(days <= 0) return 'vip-expired';
      if(days <= 7) return 'vip-expiring';
      return '';
    }
    function vipRemainTextClass(expire){
      const days = vipRemainNumber(expire);
      if(days == null) return 'vip-remain';
      if(days <= 0) return 'vip-remain expired';
      if(days <= 7) return 'vip-remain warn';
      return 'vip-remain';
    }
    function getTok(){ return localStorage.getItem(ADMIN_TOKEN_KEY); }
    function jsStr(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\r?\n/g,'\\n'); }

    async function doAdminLogin(){
      const pw = (document.getElementById('adminPw').value||'').trim();
      const msg = document.getElementById('adminMsg');
      if(!pw){ msg.textContent='请输入密码'; return; }
      const d = await sbRpc('admin_login', { p_password: pw });
      if(!d || !d.ok){ msg.textContent = (d&&d.msg)||'登录失败'; return; }
      localStorage.setItem(ADMIN_TOKEN_KEY, d.admin_token);
      document.getElementById('loginBox').style.display='none';
      document.getElementById('dash').style.display='block';
      loadAll();
    }

    async function loadAll(){ renderMonthlyMemberStats(); await loadStats(); await loadSiteAnnouncementAdmin(); await loadUsers(); await loadComments(); }

    async function loadStats(){
      const d = await sbRpc('admin_stats', { p_admin_token: getTok() });
      if(d && d.ok){
        document.getElementById('statUsers').textContent = d.users;
        document.getElementById('statVip').textContent = d.vip;
        document.getElementById('statCmts').textContent = d.comments;
      }
    }

    function getMonthlyMemberStats(){
      try { return JSON.parse(localStorage.getItem(MONTHLY_MEMBER_STATS_KEY) || '{}') || {}; }
      catch(e){ return {}; }
    }
    function saveMonthlyMemberStats(data){
      localStorage.setItem(MONTHLY_MEMBER_STATS_KEY, JSON.stringify(data || {}));
    }
    function recentMonthKeys(count){
      const out = [];
      const d = new Date();
      d.setDate(1);
      for(let i = 0; i < count; i++){
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        out.push(y + '-' + m);
        d.setMonth(d.getMonth() - 1);
      }
      return out;
    }
    function monthlyAmount(n){
      return Math.max(0, Number(n) || 0) * 500;
    }
    function fmtMoney(n){
      return '¥' + Number(n || 0).toLocaleString('zh-CN');
    }
    function renderMonthlyMemberStats(){
      const box = document.getElementById('monthlyMemberStats');
      if(!box) return;
      const data = getMonthlyMemberStats();
      const months = recentMonthKeys(monthlyMemberStatsExpanded ? 12 : 3);
      const toggle = document.getElementById('monthlyMemberStatsToggle');
      if(toggle) toggle.textContent = monthlyMemberStatsExpanded ? '收起' : '展开';
      let totalCount = 0;
      let totalAmount = 0;
      const rows = months.map(month => {
        const count = Math.max(0, Number(data[month]) || 0);
        const amount = monthlyAmount(count);
        totalCount += count;
        totalAmount += amount;
        return `<tr><td>${month}</td><td><input class="monthly-stat-input" type="number" min="0" step="1" value="${count || ''}" data-month="${month}" oninput="updateMonthlyMemberStat(this)"></td><td>${fmtMoney(amount)}</td></tr>`;
      }).join('');
      box.innerHTML = '<table class="admin-table"><tr><th>月份</th><th>会员数量</th><th>金额</th></tr>' +
        rows +
        `<tr class="monthly-stat-total"><td>汇总</td><td>${totalCount}</td><td>${fmtMoney(totalAmount)}</td></tr>` +
        '</table>';
    }
    function toggleMonthlyMemberStats(){
      monthlyMemberStatsExpanded = !monthlyMemberStatsExpanded;
      renderMonthlyMemberStats();
    }
    function updateMonthlyMemberStat(input){
      const month = input && input.dataset ? input.dataset.month : '';
      if(!month) return;
      const data = getMonthlyMemberStats();
      const count = Math.max(0, Math.floor(Number(input.value) || 0));
      if(count) data[month] = count;
      else delete data[month];
      saveMonthlyMemberStats(data);
      renderMonthlyMemberStats();
      const next = document.querySelector('.monthly-stat-input[data-month="' + month + '"]');
      if(next) {
        next.focus();
        try { next.setSelectionRange(next.value.length, next.value.length); } catch(e) {}
      }
    }

    async function loadSiteAnnouncementAdmin(){
      const msg = document.getElementById('siteAnnouncementMsg');
      if(msg) msg.textContent = '加载中...';
      const d = await sbRpc('get_site_announcement', {});
      if(!d || !d.ok || !d.item){
        if(msg) msg.textContent = '加载失败';
        return;
      }
      const loadedContent = (d.item.content || '').trim();
      document.getElementById('siteAnnouncementTitle').value = loadedContent ? (d.item.title || '') : '';
      document.getElementById('siteAnnouncementContent').value = loadedContent;
      if(msg) msg.textContent = '已加载';
    }

    async function saveSiteAnnouncement(){
      const title = (document.getElementById('siteAnnouncementTitle').value || '').trim();
      const content = (document.getElementById('siteAnnouncementContent').value || '').trim();
      await submitSiteAnnouncement(title, content);
    }

    async function clearSiteAnnouncement(){
      const titleInput = document.getElementById('siteAnnouncementTitle');
      const contentInput = document.getElementById('siteAnnouncementContent');
      if (titleInput) titleInput.value = '';
      if (contentInput) contentInput.value = '';
      await submitSiteAnnouncement('', '');
    }

    async function submitSiteAnnouncement(title, content){
      const msg = document.getElementById('siteAnnouncementMsg');
      if(!title && content){ if(msg) msg.textContent = '标题不能为空'; return; }
      if(msg) msg.textContent = '保存中...';
      const d = await sbRpc('admin_update_site_announcement', {
        p_admin_token: getTok(),
        p_title: title,
        p_summary: content,
        p_content: content
      });
      if(!d || !d.ok){ if(msg) msg.textContent = '保存失败：' + ((d&&d.msg)||'未知错误'); return; }
      if (!content) {
        const titleInput = document.getElementById('siteAnnouncementTitle');
        const contentInput = document.getElementById('siteAnnouncementContent');
        if (titleInput) titleInput.value = '';
        if (contentInput) contentInput.value = '';
      }
      if(msg) msg.textContent = content ? '保存成功，通知栏会显示这条公告' : '已清空公告，通知栏不再显示';
    }

    async function loadUsers(){
      const d = await sbRpc('admin_list_users', { p_admin_token: getTok() });
      const box = document.getElementById('userList');
      if(!d || !d.ok){ box.innerHTML = '<p>加载失败：' + (d&&d.msg) + '</p>'; return; }
      if(!d.list.length){ box.innerHTML = '<p>暂无用户</p>'; return; }
      box.innerHTML = '<table class="admin-table"><tr><th>昵称</th><th>邮箱</th><th>注册时间</th><th>会员</th><th>开通时间</th><th>会员天数</th><th>到期时间</th><th>剩余天数</th><th>操作</th></tr>' +
        d.list.map(u=>`<tr class="${vipRemainClass(u.vip_expire)}"><td>${esc(u.nickname||'')}</td><td class="email">${esc(u.email||'')}</td><td>${u.created_at?fmt(u.created_at):'-'}</td><td>${u.is_vip?'是':'否'}</td><td>${u.vip_started_at?fmt(u.vip_started_at):'-'}</td><td>${vipDays(u.vip_started_at)}</td><td>${u.vip_expire?fmt(u.vip_expire):'-'}</td><td><span class="${vipRemainTextClass(u.vip_expire)}">${vipRemainDays(u.vip_expire)}</span></td><td><button onclick="openVipModal('${jsStr(u.email||'')}')">设会员</button><button class="renew" onclick="renewVip30('${jsStr(u.email||'')}','${jsStr(u.vip_expire||'')}')">续30天</button></td></tr>`).join('') +
        '</table>';
    }

    async function renewVip30(email, expire){
      if(!email) return;
      const left = vipRemainNumber(expire);
      const days = Math.max(0, left == null ? 0 : left) + 30;
      if(!confirm('确认给 ' + email + ' 续 30 天会员？')) return;
      const d = await sbRpc('admin_set_vip', { p_admin_token:getTok(), p_email:email, p_days:days });
      alert(d && d.ok ? ('已续费，到期：' + fmt(d.vip_expire)) : ('失败：' + ((d&&d.msg)||'未知错误')));
      loadStats(); loadUsers();
    }

    let __vipTargetEmail = '';
    function openVipModal(email){
      if(!email){ alert('该用户无邮箱，无法设置会员'); return; }
      __vipTargetEmail = email;
      document.getElementById('vipModalDate').value = '';
      document.getElementById('vipModal').classList.add('open');
    }
    function closeVipModal(){ document.getElementById('vipModal').classList.remove('open'); __vipTargetEmail = ''; }
    async function confirmVipDate(){
      const dateStr = document.getElementById('vipModalDate').value;
      if(!dateStr){ alert('请选择到期日期'); return; }
      const target = new Date(dateStr + 'T23:59:59');
      const now = new Date();
      const diffMs = target - now;
      const days = Math.ceil(diffMs / (1000*60*60*24));
      const d = await sbRpc('admin_set_vip', { p_admin_token: getTok(), p_email: __vipTargetEmail, p_days: days });
      alert(d && d.ok ? '设置成功：到期时间 ' + dateStr : ('失败：' + (d&&d.msg)));
      closeVipModal();
      loadUsers();
    }

    let __allComments = [];
    let __commentArticles = [
      { id:'market-overview', label:'市场大局观', group:'article' },
      { id:'trading-mindset', label:'四种心态', group:'article' }
    ];
    async function loadReviewCommentArticles(){
      try{
        const r = await fetch('assets/reviews/index.json?t=' + Date.now(), { cache:'no-store' });
        if(!r.ok) return [];
        const arr = await r.json();
        return (Array.isArray(arr) ? arr : [])
          .map(x => String(x && (x.date || x.id || '')).trim())
          .filter(Boolean)
          .sort((a,b) => b.localeCompare(a))
          .map(date => ({ id:'review:' + date, label:'复盘 ' + date.slice(5).replace('-', '/'), group:'review' }));
      }catch(e){
        return [];
      }
    }
    function cmtArticleLabel(article){
      const hit = __commentArticles.find(a => a.id === article);
      if(hit) return hit.label;
      if(String(article || '').startsWith('review:')){
        const date = String(article).slice(7);
        return '复盘 ' + date.slice(5).replace('-', '/');
      }
      return article || '-';
    }
    async function loadComments(){
      const reviewArts = await loadReviewCommentArticles();
      __commentArticles = [
        { id:'market-overview', label:'市场大局观', group:'article' },
        { id:'trading-mindset', label:'四种心态', group:'article' },
        ...reviewArts
      ];
      const arts = __commentArticles.map(a => a.id);
      let all = [];
      for(const a of arts){
        const d = await sbRpc('list_comments', { p_article: a });
        if(d && d.ok) all = all.concat(d.list.map(c=>({ ...c, article:a })));
      }
      __allComments = all;
      renderComments();
    }

    function renderComments(){
      const box = document.getElementById('commentList');
      const filter = document.getElementById('cmtFilter').value;
      const search = (document.getElementById('cmtSearch').value || '').trim().toLowerCase();
      let list = __allComments;
      if(filter === '__reviews') list = list.filter(c => String(c.article || '').startsWith('review:'));
      else if(filter) list = list.filter(c => c.article === filter);
      if(search) list = list.filter(c => (c.content||'').toLowerCase().includes(search) || (c.nickname||'').toLowerCase().includes(search));
      if(!list.length){ box.innerHTML = '<p>暂无评论</p>'; return; }
      box.innerHTML = '<table class="admin-table"><tr><th>昵称</th><th>邮箱</th><th>文章</th><th>评论</th><th>时间</th><th>操作</th></tr>' +
        list.map(c=>`<tr><td>${esc(c.nickname||'匿名')}</td><td class="email">${esc(c.email||'-')}</td><td><span class="badge">${esc(cmtArticleLabel(c.article))}</span></td><td class="wrap">${esc(c.content||'')}</td><td>${fmt(c.created_at)}</td><td><button class="danger" onclick="delComment(${c.id})">删除</button></td></tr>`).join('') +
        '</table>';
    }

    async function delComment(id){
      if(!confirm('确认删除该评论？')) return;
      const d = await sbRpc('admin_delete_comment', { p_admin_token: getTok(), p_id: id });
      alert(d && d.ok ? '已删除' : '失败');
      loadComments();
    }

    // 点击遮罩关闭弹窗
    document.getElementById('vipModal').addEventListener('click', (e)=>{ if(e.target === document.getElementById('vipModal')) closeVipModal(); });

    // 已登录则直接进
    if(localStorage.getItem(ADMIN_TOKEN_KEY)){
      document.getElementById('loginBox').style.display='none';
      document.getElementById('dash').style.display='block';
      loadAll();
    }
  </script>
</body>
</html>
